name: Shell checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y busybox jq shellcheck
      - run: busybox ash -n xray-reality.sh
      - run: shellcheck -s ash xray-reality.sh
      - run: busybox ash tests/unit.sh ./xray-reality.sh
